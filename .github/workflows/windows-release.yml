name: Build Windows app

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example v0.1.0). Leave blank to build an artifact only.'
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compile and package portable app
        id: package
        shell: powershell
        run: |
          .\build.ps1
          if ($LASTEXITCODE -ne 0) { throw "Build failed with exit code $LASTEXITCODE" }

          $package = Join-Path $env:RUNNER_TEMP 'cctv-report-desk'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item '.\CCTV Report Desk.exe' $package
          Copy-Item '.\hikvision_report_all.ps1' $package
          Copy-Item '.\cameras.csv.example' $package
          Copy-Item '.\nvr_list.csv.example' $package
          Copy-Item '.\README.md' $package
          Copy-Item '.\DESIGN.md' $package

          $zipPath = Join-Path $env:RUNNER_TEMP 'CCTV-Report-Desk-win-x64.zip'
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath $zipPath -Force
          "PACKAGE_PATH=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "package=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CCTV-Report-Desk-win-x64
          path: ${{ steps.package.outputs.package }}
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF.StartsWith('refs/tags/')) {
            $releaseTag = $env:GITHUB_REF_NAME
          } else {
            $releaseTag = $env:RELEASE_VERSION.Trim()
          }
          if ($releaseTag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$') {
            throw "Release version must look like v1.2.3 (received: '$releaseTag')"
          }

          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $releaseBody = @{
            tag_name = $releaseTag
            name = "CCTV Report Desk $releaseTag"
            body = 'Portable Windows build. Copy the example CSV files to cameras.csv and nvr_list.csv, then add the license.key issued for this computer.'
            draft = $false
            prerelease = $false
          } | ConvertTo-Json
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases" -Method Post -Headers $headers -ContentType 'application/vnd.github+json' -Body $releaseBody
          $uploadUrl = $release.upload_url -replace '\{\?name,label\}$', ''
          $assetName = "CCTV-Report-Desk-$releaseTag-win-x64.zip"
          Invoke-RestMethod -Uri "$uploadUrl?name=$assetName" -Method Post -Headers $headers -ContentType 'application/zip' -InFile $env:PACKAGE_PATH | Out-Null

